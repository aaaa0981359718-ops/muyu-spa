<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>莯浴 SPA｜管理後台</title>
<style>
body{margin:0;background:#f6f2ef;color:#282421;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}.wrap{max-width:900px;margin:auto;padding:22px 16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:25px}.panel{background:#fff;border:1px solid #e5ddd7;border-radius:18px;padding:20px;margin-bottom:18px}input,textarea,button{font:inherit;width:100%;padding:11px;border:1px solid #d8cec7;border-radius:10px;box-sizing:border-box}textarea{min-height:90px;resize:vertical}label{display:block;font-size:13px;color:#6f665f;margin:12px 0 6px}button{background:#2b2724;color:#fff;font-weight:700;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border-top:1px solid #eee5df;padding:18px 0}.item:first-child{border-top:0}.item img{width:110px;height:110px;object-fit:cover;border-radius:12px;background:#eee}.actions{display:flex;gap:8px;margin-top:10px}.actions button:last-child{background:#8a3f35}.hidden{display:none}.muted{color:#7c736c;font-size:13px}.ok{padding:10px;background:#eee6df;border-radius:10px;margin-bottom:12px}@media(max-width:650px){.row{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px}.top a{font-size:13px}}
</style></head><body><div class="wrap"><div class="top"><h1>莯浴 SPA｜管理後台</h1><a href="/">← 回網站</a></div>
<div id="login" class="panel"><h2>管理員登入</h2><p class="muted">第一次使用請在伺服器設定 ADMIN_PASSWORD。</p><input id="pw" type="password" placeholder="管理員密碼"><button onclick="login()" style="margin-top:12px">登入</button></div>
<div id="app" class="hidden"><div id="msg"></div><div class="panel"><h2>店家設定</h2><div class="row"><div><label>營業時間</label><input id="hours"></div><div><label>電話</label><input id="phone"></div></div><label>LINE</label><input id="line"><button onclick="saveSettings()" style="margin-top:12px">儲存店家設定</button></div>
<div class="panel"><h2>新增美容師</h2><form id="add"><div class="row"><div><label>編號</label><input name="no" required></div><div><label>名稱</label><input name="name" value="美容師"></div></div><div class="row"><div><label>國籍</label><input name="nationality" placeholder="例如 🇹🇼 台灣"></div><div><label>今日上班時間</label><input name="time" placeholder="14:00～23:00"></div></div><label>介紹</label><textarea name="intro"></textarea><label>照片（JPG / PNG / WEBP，8MB 內）</label><input name="photo" type="file" accept="image/jpeg,image/png,image/webp"><label><input name="today" type="checkbox" checked style="width:auto"> 顯示於今日報班</label><button style="margin-top:12px">新增美容師</button></form></div>
<div class="panel"><h2>美容師資料</h2><div id="list"></div></div></div></div>
<script>
let token=localStorage.muyuToken||"";const $=s=>document.querySelector(s);
function headers(){return {"Authorization":"Bearer "+token}}
async function login(){const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("#pw").value})});if(!r.ok){alert("密碼錯誤");return}const d=await r.json();token=d.token;localStorage.muyuToken=token;show()}
function show(){$("#login").classList.add("hidden");$("#app").classList.remove("hidden");load()}
async function load(){const d=await fetch("/api/site").then(r=>r.json());$("#hours").value=d.settings.businessHours||"";$("#phone").value=d.settings.phone||"";$("#line").value=d.settings.line||"";$("#list").innerHTML=d.beauticians.map(x=>`<div class="item"><div style="display:flex;gap:14px">${x.photo?`<img src="${x.photo}">`:"<div style='width:110px;height:110px;background:#eee;border-radius:12px;display:grid;place-items:center'>無照片</div>"}<div><b>${x.no}號｜${x.name}</b><div class="muted">${x.nationality||""}<br>⏰ ${x.time||"未設定"}<br>${x.today?"📋 今日報班":"未列入今日"}</div></div></div><div class="actions"><button onclick="editItem('${x.id}')">編輯</button><button onclick="delItem('${x.id}')">刪除</button></div></div>`).join("")||"<p class='muted'>尚無資料。</p>";window.db=d}
async function saveSettings(){await fetch("/api/settings",{method:"POST",headers:{...headers(),"Content-Type":"application/json"},body:JSON.stringify({businessHours:$("#hours").value,phone:$("#phone").value,line:$("#line").value})});$("#msg").innerHTML="<div class='ok'>已儲存店家設定</div>"}
$("#add").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);f.set("today",e.target.today.checked);const r=await fetch("/api/beauticians",{method:"POST",headers:headers(),body:f});if(!r.ok){alert("新增失敗");return}e.target.reset();e.target.today.checked=true;load();$("#msg").innerHTML="<div class='ok'>美容師已新增</div>"}
async function delItem(id){if(!confirm("確定要刪除？"))return;await fetch("/api/beauticians/"+id,{method:"DELETE",headers:headers()});load()}
async function editItem(id){const x=window.db.beauticians.find(a=>a.id===id);const no=prompt("編號",x.no);if(no===null)return;const name=prompt("名稱",x.name);if(name===null)return;const time=prompt("上班時間",x.time||"");const nat=prompt("國籍",x.nationality||"");const intro=prompt("介紹",x.intro||"");const today=confirm("要顯示在今日報班嗎？");const body=new URLSearchParams({no,name,time,nationality:nat,intro,today:String(today)});await fetch("/api/beauticians/"+id,{method:"PUT",headers:{...headers(),"Content-Type":"application/x-www-form-urlencoded"},body});load()}
if(token)show();
</script></body></html>
