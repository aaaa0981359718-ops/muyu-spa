<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>莯浴 SPA｜管理後台</title><style>body{margin:0;background:#f6f2ef;color:#282421;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}.wrap{max-width:900px;margin:auto;padding:22px 16px}.top{display:flex;justify-content:space-between;align-items:center}.panel{background:#fff;border:1px solid #e5ddd7;border-radius:18px;padding:20px;margin:18px 0}input,textarea,button{font:inherit;width:100%;padding:11px;border:1px solid #d8cec7;border-radius:10px;box-sizing:border-box}textarea{min-height:90px}label{display:block;font-size:13px;color:#6f665f;margin:12px 0 6px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{background:#2b2724;color:#fff;font-weight:700}.item{border-top:1px solid #eee5df;padding:18px 0}.item img{width:110px;height:110px;object-fit:cover;border-radius:12px}.actions{display:flex;gap:8px;margin-top:10px}.actions button:last-child{background:#8a3f35}.hidden{display:none}.muted{color:#7c736c;font-size:13px}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><h1>莯浴 SPA｜管理後台</h1><a href="/">← 回網站</a></div><div id="login" class="panel"><h2>管理員登入</h2><input id="pw" type="password" placeholder="管理員密碼"><button onclick="login()" style="margin-top:12px">登入</button></div><div id="app" class="hidden"><div class="panel"><h2>店家設定</h2><div class="row"><div><label>營業時間</label><input id="hours"></div><div><label>電話</label><input id="phone"></div></div><label>LINE</label><input id="line"><button onclick="saveSettings()" style="margin-top:12px">儲存</button></div><div class="panel"><h2>新增美容師</h2><form id="add"><div class="row"><div><label>編號</label><input name="no" required></div><div><label>名稱</label><input name="name" value="美容師"></div></div><div class="row"><div><label>國籍</label><input name="nationality" placeholder="例如 🇹🇼 台灣"></div><div><label>上班時間</label><input name="time" placeholder="14:00～23:00"></div></div><label>介紹</label><textarea name="intro"></textarea><label>照片網址</label><input name="photo" placeholder="先用圖片網址；正式 R2 上傳功能下一階段加入"><label><input name="today" type="checkbox" checked style="width:auto"> 顯示於今日報班</label><button style="margin-top:12px">新增</button></form></div><div class="panel"><h2>美容師資料</h2><div id="list"></div></div></div></div><script>
let token=localStorage.muyuToken||"",db;const $=s=>document.querySelector(s);const H=()=>({"Authorization":"Bearer "+token});
async function login(){const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("#pw").value})});if(!r.ok)return alert("密碼錯誤");token=(await r.json()).token;localStorage.muyuToken=token;show()}function show(){$("#login").classList.add("hidden");$("#app").classList.remove("hidden");load()}
async function load(){db=await fetch("/api/site").then(r=>r.json());$("#hours").value=db.settings.businessHours||"";$("#phone").value=db.settings.phone||"";$("#line").value=db.settings.line||"";$("#list").innerHTML=db.beauticians.map(x=>`<div class="item"><div style="display:flex;gap:14px">${x.photo?`<img src="${x.photo}">`:"無照片"}<div><b>${x.no}號｜${x.name}</b><div class="muted">${x.nationality||""}<br>⏰ ${x.time||""}<br>${x.today?"📋 今日報班":"未列入今日"}</div></div></div><div class="actions"><button onclick="edit('${x.id}')">編輯</button><button onclick="del('${x.id}')">刪除</button></div></div>`).join("")||"尚無資料"}async function saveSettings(){await fetch("/api/settings",{method:"POST",headers:{...H(),"Content-Type":"application/json"},body:JSON.stringify({businessHours:$("#hours").value,phone:$("#phone").value,line:$("#line").value})});alert("已儲存")}
$("#add").onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.today=e.target.today.checked;await fetch("/api/beauticians",{method:"POST",headers:{...H(),"Content-Type":"application/json"},body:JSON.stringify(o)});e.target.reset();load()}
async function del(id){if(confirm("確定刪除？")){await fetch("/api/beauticians/"+id,{method:"DELETE",headers:H()});load()}}
async function edit(id){const x=db.beauticians.find(a=>a.id===id);const body={no:prompt("編號",x.no),name:prompt("名稱",x.name),nationality:prompt("國籍",x.nationality),time:prompt("時間",x.time),intro:prompt("介紹",x.intro),photo:prompt("照片網址",x.photo),today:confirm("顯示在今日報班？")};if(body.no===null)return;await fetch("/api/beauticians/"+id,{method:"PUT",headers:{...H(),"Content-Type":"application/json"},body:JSON.stringify(body)});load()}if(token)show();
</script></body></html>
