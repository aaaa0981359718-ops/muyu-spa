<!doctype html>
<html lang="zh-Hant">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>莯浴SPA會館｜管理後台</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f7f4f1;
  color:#292522;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "PingFang TC",
    "Microsoft JhengHei",
    sans-serif;
}

.wrap{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

header{
  background:#40332c;
  color:white;
  padding:22px 0;
}

h1{
  margin:0;
  font-size:25px;
  letter-spacing:2px;
}

h2{
  margin:0 0 8px;
  font-size:24px;
}

.sub{
  color:#817870;
  margin:0 0 20px;
}

section{
  margin-top:22px;
}

.box{
  background:white;
  border:1px solid #e6ddd6;
  border-radius:20px;
  padding:22px;
  box-shadow:0 8px 25px rgba(50,35,25,.05);
}

label{
  display:block;
  margin-bottom:7px;
  font-weight:700;
}

input{
  width:100%;
  padding:13px 14px;
  border:1px solid #dcd2ca;
  border-radius:12px;
  font-size:16px;
  margin-bottom:15px;
  outline:none;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 17px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  background:#4a3830;
  color:white;
}

button.danger{
  background:#9a4e43;
}

button:disabled{
  opacity:.5;
}

.uploadArea{
  border:2px dashed #d5c7bd;
  border-radius:18px;
  padding:24px;
  text-align:center;
  background:#fcfaf8;
}

.uploadArea p{
  color:#817870;
  line-height:1.7;
}

input[type=file]{
  border:0;
  padding:0;
  margin:10px 0 0;
}

.preview{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-top:18px;
}

.previewItem{
  aspect-ratio:1/1;
  border-radius:14px;
  overflow:hidden;
  background:#eee5de;
}

.previewItem img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.count{
  margin-top:14px;
  font-weight:700;
  color:#765744;
}

.photoGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.photoCard{
  background:white;
  border:1px solid #e5dcd5;
  border-radius:17px;
  overflow:hidden;
}

.photoCard img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
}

.photoInfo{
  padding:12px;
}

.empty{
  padding:25px;
  border-radius:15px;
  background:#faf8f6;
  color:#827970;
  text-align:center;
}

.notice{
  margin-top:15px;
  background:#40332c;
  color:white;
  border-radius:16px;
  padding:18px;
  line-height:1.7;
}

.notice span{
  color:#ddd3cc;
}

.status{
  margin-top:12px;
  font-weight:700;
}

@media(max-width:720px){

  .wrap{
    padding:15px;
  }

  h1{
    font-size:21px;
  }

  .preview{
    grid-template-columns:repeat(2,1fr);
  }

  .photoGrid{
    grid-template-columns:repeat(2,1fr);
  }

  button{
    width:100%;
  }

}

</style>

</head>

<body>


<header>

<div class="wrap">

<h1>
莯浴SPA會館｜管理後台
</h1>

</div>

</header>


<!-- 登入 -->

<div
  id="loginBox"
  class="box"
  style="max-width:450px;margin:50px auto;"
>

<h2>
管理員登入
</h2>

<p class="sub">
請輸入管理密碼
</p>

<input
  id="password"
  type="password"
  placeholder="管理密碼"
>

<button onclick="login()">
登入
</button>

<div
  id="loginStatus"
  class="status"
></div>

</div>


<!-- 管理區 -->

<div
  id="adminArea"
  style="display:none;"
>

<div class="wrap">


<!-- 店家資訊 -->

<section>

<h2>
🏠 店家資訊
</h2>

<p class="sub">
這些資料會顯示在網站。
</p>

<div class="box">

<label>
營業時間
</label>

<input
  id="businessHours"
  value="12：00～04：00"
>

<label>
電話
</label>

<input
  id="phone"
  placeholder="例如：06-3130026"
>

<label>
LINE
</label>

<input
  id="line"
  placeholder="例如：LINE ID"
>

<button onclick="saveSettings()">
儲存店家資訊
</button>

<div
  id="settingsStatus"
  class="status"
></div>

</div>

</section>


<!-- 今日報班 -->

<section>

<h2>
📋 今日報班
</h2>

<p class="sub">
目前上傳的照片會直接顯示在網站。
</p>

<div class="box">

<div
  id="todayGrid"
  class="photoGrid"
></div>


<div class="notice">

<b>
🗑️ 一鍵清除目前報班
</b>

<br>

<span>
按下後會直接刪除目前所有照片。
<br>
00:00 不會清除。
<br>
凌晨 04:00 會自動清除。
</span>

</div>


<div style="margin-top:15px">

<button
  class="danger"
  onclick="clearToday()"
>
🗑️ 一鍵清除目前報班
</button>

</div>


<div
  id="clearStatus"
  class="status"
></div>

</div>

</section>


<!-- 上傳 -->

<section>

<h2>
📸 上傳今日報班照片
</h2>

<p class="sub">
一次最多選擇 8 張照片。
</p>

<div class="box">

<div class="uploadArea">

<b>
選擇照片
</b>

<p>
可以一次從手機相簿選擇多張照片。
</p>

<input
  id="photoInput"
  type="file"
  accept="image/*"
  multiple
  onchange="previewPhotos()"
>


<div
  id="preview"
  class="preview"
></div>


<div
  id="photoCount"
  class="count"
></div>


<div style="margin-top:18px">

<button
  id="uploadBtn"
  onclick="uploadPhotos()"
  disabled
>
📤 上傳全部照片
</button>

</div>


<div
  id="uploadStatus"
  class="status"
></div>

</div>

</div>

</section>


</div>

</div>


<script>

let token =
  localStorage.getItem(
    "muyu_admin_token"
  ) || "";

let selectedFiles = [];


/* =========================
   登入
========================= */

async function login(){

  const password =
    document.querySelector(
      "#password"
    ).value;

  const status =
    document.querySelector(
      "#loginStatus"
    );


  if(!password){

    status.textContent =
      "請輸入管理密碼";

    return;
  }


  status.textContent =
    "登入中...";


  try{

    const response =
      await fetch(
        "/api/login",
        {
          method:"POST",

          headers:{
            "content-type":
              "application/json"
          },

          body:
            JSON.stringify({
              password
            })
        }
      );


    const data =
      await response.json();


    if(!data.ok){

      status.textContent =
        data.message ||
        "登入失敗";

      return;
    }


    token =
      data.token;


    localStorage.setItem(
      "muyu_admin_token",
      token
    );


    document.querySelector(
      "#loginBox"
    ).style.display =
      "none";


    document.querySelector(
      "#adminArea"
    ).style.display =
      "block";


    load();


  }catch(error){

    status.textContent =
      "登入失敗，請稍後再試。";

  }

}


/* =========================
   自動登入
========================= */

async function autoLogin(){

  if(!token){

    return;
  }


  try{

    const response =
      await fetch(
        "/api/site"
      );


    if(!response.ok){

      localStorage.removeItem(
        "muyu_admin_token"
      );

      token = "";

      return;
    }


    document.querySelector(
      "#loginBox"
    ).style.display =
      "none";


    document.querySelector(
      "#adminArea"
    ).style.display =
      "block";


    load();


  }catch(error){

    console.error(error);

  }

}


/* =========================
   API Header
========================= */

function authHeaders(){

  return {

    "Authorization":
      `Bearer ${token}`,

    "content-type":
      "application/json"

  };

}


/* =========================
   讀取資料
========================= */

async function load(){

  try{

    const response =
      await fetch(
        "/api/site"
      );


    const db =
      await response.json();


    const settings =
      db.settings || {};


    document.querySelector(
      "#businessHours"
    ).value =
      settings.businessHours ||
      "12：00～04：00";


    document.querySelector(
      "#phone"
    ).value =
      settings.phone || "";


    document.querySelector(
      "#line"
    ).value =
      settings.line || "";


    renderPhotos(
      db.beauticians || []
    );


  }catch(error){

    alert(
      "資料讀取失敗：" +
      error.message
    );

  }

}


/* =========================
   顯示照片
========================= */

function renderPhotos(items){

  const grid =
    document.querySelector(
      "#todayGrid"
    );


  if(!items.length){

    grid.innerHTML =
      `
      <div class="empty">
        目前沒有報班照片。
      </div>
      `;

    return;
  }


  grid.innerHTML =
    items.map(
      item => `

        <div class="photoCard">

          <img
            src="${item.photo}"
            alt="報班照片"
          >

          <div class="photoInfo">

            <button
              class="danger"
              onclick="deletePhoto('${item.id}')"
            >
              🗑️ 刪除這張
            </button>

          </div>

        </div>

      `
    ).join("");

}


/* =========================
   預覽
========================= */

function previewPhotos(){

  const input =
    document.querySelector(
      "#photoInput"
    );

  const preview =
    document.querySelector(
      "#preview"
    );

  const count =
    document.querySelector(
      "#photoCount"
    );

  const button =
    document.querySelector(
      "#uploadBtn"
    );


  selectedFiles =
    Array.from(
      input.files
    );


  if(
    selectedFiles.length > 8
  ){

    alert(
      "一次最多只能選擇 8 張照片。"
    );

    selectedFiles =
      selectedFiles.slice(0,8);

  }


  preview.innerHTML = "";


  selectedFiles.forEach(
    file => {

      const url =
        URL.createObjectURL(
          file
        );


      preview.innerHTML += `

        <div class="previewItem">

          <img src="${url}">

        </div>

      `;

    }
  );


  count.textContent =
    selectedFiles.length
      ? `已選擇 ${selectedFiles.length} 張照片`
      : "";


  button.disabled =
    selectedFiles.length === 0;

}


/* =========================
   壓縮
========================= */

function compressImage(file){

  return new Promise(
    resolve => {

      const img =
        new Image();

      const reader =
        new FileReader();


      reader.onload =
        e => {

          img.onload =
            () => {

              const max = 1000;

              let width =
                img.width;

              let height =
                img.height;


              if(width > max){

                height =
                  height *
                  max /
                  width;

                width =
                  max;

              }


              if(height > max){

                width =
                  width *
                  max /
                  height;

                height =
                  max;

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                Math.round(width);

              canvas.height =
                Math.round(height);


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  0.65
                )
              );

            };


          img.src =
            e.target.result;

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================
   上傳
========================= */

async function uploadPhotos(){

  if(!selectedFiles.length){

    return;
  }


  const button =
    document.querySelector(
      "#uploadBtn"
    );

  const status =
    document.querySelector(
      "#uploadStatus"
    );


  button.disabled = true;

  status.textContent =
    "照片處理中，請稍候...";


  try{

    const photos = [];


    for(
      const file of selectedFiles
    ){

      photos.push(
        await compressImage(file)
      );

    }


    status.textContent =
      "正在上傳照片...";


    const response =
      await fetch(
        "/api/beauticians/batch",
        {
          method:"POST",

          headers:
            authHeaders(),

          body:
            JSON.stringify({
              photos
            })
        }
      );


    const data =
      await response.json();


    if(!data.ok){

      throw new Error(
        data.message ||
        "上傳失敗"
      );

    }


    status.textContent =
      `成功上傳 ${data.added} 張照片。`;


    selectedFiles = [];

    document.querySelector(
      "#photoInput"
    ).value = "";

    document.querySelector(
      "#preview"
    ).innerHTML = "";

    document.querySelector(
      "#photoCount"
    ).textContent = "";


    await load();


  }catch(error){

    status.textContent =
      "上傳失敗：" +
      error.message;

  }


  button.disabled =
    selectedFiles.length === 0;

}


/* =========================
   一鍵清除
========================= */

async function clearToday(){

  const ok =
    confirm(
      "確定要刪除目前所有報班照片嗎？\n\n刪除後網站也會立即沒有任何照片。"
    );


  if(!ok){

    return;
  }


  const status =
    document.querySelector(
      "#clearStatus"
    );


  status.textContent =
    "清除中...";


  try{

    const response =
      await fetch(
        "/api/beauticians/today",
        {
          method:"DELETE",
          headers:
            authHeaders()
        }
      );


    const data =
      await response.json();


    if(!data.ok){

      throw new Error(
        data.message ||
        "清除失敗"
      );

    }


    status.textContent =
      `已清除 ${data.removed || 0} 張照片。`;


    await load();


  }catch(error){

    status.textContent =
      "清除失敗：" +
      error.message;

  }

}


/* =========================
   單張刪除
========================= */

async function deletePhoto(id){

  const ok =
    confirm(
      "確定要刪除這張照片嗎？"
    );


  if(!ok){

    return;
  }


  try{

    const response =
      await fetch(
        `/api/beauticians/${id}`,
        {
          method:"DELETE",
          headers:
            authHeaders()
        }
      );


    const data =
      await response.json();


    if(!data.ok){

      throw new Error(
        data.message ||
        "刪除失敗"
      );

    }


    await load();


  }catch(error){

    alert(
      "刪除失敗：" +
      error.message
    );

  }

}


/* =========================
   店家資訊
========================= */

async function saveSettings(){

  const status =
    document.querySelector(
      "#settingsStatus"
    );


  status.textContent =
    "儲存中...";


  try{

    const response =
      await fetch(
        "/api/settings",
        {
          method:"PUT",

          headers:
            authHeaders(),

          body:
            JSON.stringify({

              businessHours:
                document.querySelector(
                  "#businessHours"
                ).value,

              phone:
                document.querySelector(
                  "#phone"
                ).value,

              line:
                document.querySelector(
                  "#line"
                ).value

            })
        }
      );


    const data =
      await response.json();


    if(!data.ok){

      throw new Error(
        data.message ||
        "儲存失敗"
      );

    }


    status.textContent =
      "店家資訊已儲存。";


  }catch(error){

    status.textContent =
      "儲存失敗：" +
      error.message;

  }

}


/* =========================
   啟動
========================= */

autoLogin();

</script>

</body>

</html>
