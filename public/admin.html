<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>莯浴SPA會館｜管理後台</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f7f4f1;
  color:#292522;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "PingFang TC",
    "Microsoft JhengHei",
    sans-serif;
}

.wrap{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

header{
  background:#40332c;
  color:white;
  padding:22px 0;
}

h1{
  margin:0;
  font-size:25px;
  letter-spacing:2px;
}

h2{
  margin:0 0 8px;
  font-size:24px;
}

.sub{
  color:#817870;
  margin:0 0 20px;
}

section{
  margin-top:22px;
}

.box{
  background:white;
  border:1px solid #e6ddd6;
  border-radius:20px;
  padding:22px;
  box-shadow:0 8px 25px rgba(50,35,25,.05);
}

label{
  display:block;
  margin-bottom:7px;
  font-weight:700;
}

input{
  width:100%;
  padding:13px 14px;
  border:1px solid #dcd2ca;
  border-radius:12px;
  font-size:16px;
  margin-bottom:15px;
  outline:none;
}

input:focus{
  border-color:#a27a5a;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 17px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  background:#4a3830;
  color:white;
}

button.secondary{
  background:#efe3db;
  color:#60483a;
}

button.danger{
  background:#9a4e43;
  color:white;
}

button:disabled{
  opacity:.5;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

#loginBox{
  max-width:450px;
  margin:50px auto;
}

#adminArea{
  display:none;
}

.uploadArea{
  border:2px dashed #d5c7bd;
  border-radius:18px;
  padding:24px;
  text-align:center;
  background:#fcfaf8;
}

.uploadArea p{
  color:#817870;
  line-height:1.7;
}

input[type=file]{
  border:0;
  padding:0;
  margin:10px 0 0;
}

.preview{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-top:18px;
}

.previewItem{
  position:relative;
  aspect-ratio:1/1;
  border-radius:14px;
  overflow:hidden;
  background:#eee5de;
}

.previewItem img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.count{
  margin-top:14px;
  font-weight:700;
  color:#765744;
}

.photoGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.photoCard{
  background:white;
  border:1px solid #e5dcd5;
  border-radius:17px;
  overflow:hidden;
}

.photoCard img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
}

.photoInfo{
  padding:12px;
}

.photoName{
  font-weight:800;
  margin-bottom:10px;
}

.empty{
  padding:25px;
  border-radius:15px;
  background:#faf8f6;
  color:#827970;
  text-align:center;
}

.notice{
  margin-top:15px;
  background:#40332c;
  color:white;
  border-radius:16px;
  padding:18px;
  line-height:1.7;
}

.notice span{
  color:#ddd3cc;
}

.status{
  margin-top:12px;
  font-weight:700;
}

@media(max-width:720px){

  .wrap{
    padding:15px;
  }

  h1{
    font-size:21px;
  }

  .preview{
    grid-template-columns:repeat(2,1fr);
  }

  .photoGrid{
    grid-template-columns:repeat(2,1fr);
  }

  button{
    width:100%;
  }

  .actions{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>
  <div class="wrap">
    <h1>莯浴SPA會館｜管理後台</h1>
  </div>
</header>


<!-- =========================
     登入
========================= -->

<div id="loginBox" class="box">

  <h2>管理員登入</h2>

  <p class="sub">
    請輸入管理密碼
  </p>

  <input
    id="password"
    type="password"
    placeholder="管理密碼"
  >

  <button onclick="login()">
    登入
  </button>

  <div id="loginStatus" class="status"></div>

</div>


<!-- =========================
     管理區
========================= -->

<div id="adminArea">

<div class="wrap">


<!-- =========================
     店家資訊
========================= -->

<section>

  <h2>🏠 店家資訊</h2>

  <p class="sub">
    這些資料會顯示在網站的預約資訊。
  </p>

  <div class="box">

    <label>營業時間</label>

    <input
      id="businessHours"
      value="12：00～04：00"
    >

    <label>電話</label>

    <input
      id="phone"
      placeholder="例如：06-3130026"
    >

    <label>LINE</label>

    <input
      id="line"
      placeholder="例如：LINE ID"
    >

    <button onclick="saveSettings()">
      儲存店家資訊
    </button>

    <div id="settingsStatus" class="status"></div>

  </div>

</section>


<!-- =========================
     今日報班
========================= -->

<section>

  <h2>📋 今日報班</h2>

  <p class="sub">
    這裡顯示目前網站正在使用的報班照片。
  </p>

  <div class="box">

    <div id="todayGrid" class="photoGrid"></div>

    <div class="notice">
      <b>🗑️ 一鍵清除目前報班</b><br>
      <span>
        按下後會直接刪除目前所有報班照片。
        00:00 不會自動清除，凌晨 04:00 才會自動清除。
      </span>
    </div>

    <div style="margin-top:15px">

      <button
        class="danger"
        onclick="clearToday()"
      >
        🗑️ 一鍵清除目前報班
      </button>

    </div>

    <div id="clearStatus" class="status"></div>

  </div>

</section>


<!-- =========================
     上傳照片
========================= -->

<section>

  <h2>📸 上傳今日報班照片</h2>

  <p class="sub">
    一次最多選擇 8 張照片，按一次即可全部上傳。
  </p>

  <div class="box">

    <div class="uploadArea">

      <b>
        選擇美容師照片
      </b>

      <p>
        可以一次從手機相簿選擇多張照片。
      </p>

      <input
        id="photoInput"
        type="file"
        accept="image/*"
        multiple
        onchange="previewPhotos()"
      >

      <div id="preview" class="preview"></div>

      <div
        id="photoCount"
        class="count"
      ></div>

      <div style="margin-top:18px">

        <button
          id="uploadBtn"
          onclick="uploadPhotos()"
          disabled
        >
          📤 上傳全部照片
        </button>

      </div>

      <div
        id="uploadStatus"
        class="status"
      ></div>

    </div>

  </div>

</section>


<!-- =========================
     目前照片
========================= -->

<section>

  <h2>📷 目前報班照片</h2>

  <p class="sub">
    這裡就是目前網站「今日報班」所顯示的照片。
  </p>

  <div class="box">

    <div id="allGrid" class="photoGrid"></div>

  </div>

</section>


</div>
</div>


<script>

let token = "";

let selectedFiles = [];


/* =========================
   登入
========================= */

async function login(){

  const password =
    document.querySelector("#password").value;

  const status =
    document.querySelector("#loginStatus");

  if(!password){

    status.textContent =
      "請輸入管理密碼";

    return;
  }

  status.textContent =
    "登入中...";

  try{

    const response =
      await fetch(
        "/api/login",
        {
          method:"POST",
          headers:{
            "content-type":
              "application/json"
          },
          body:JSON.stringify({
            password
          })
        }
      );

    const data =
      await response.json();

    if(!data.ok){

      status.textContent =
        data.message || "登入失敗";

      return;
    }

    token =
      data.token;

    document.querySelector("#loginBox")
      .style.display="none";

    document.querySelector("#adminArea")
      .style.display="block";

    load();

  }catch(error){

    status.textContent =
      "登入失敗，請稍後再試。";

  }

}


/* =========================
   API Headers
========================= */

function authHeaders(){

  return {
    "Authorization":
      `Bearer ${token}`,
    "content-type":
      "application/json"
  };

}


/* =========================
   載入資料
========================= */

async function load(){

  try{

    const response =
      await fetch(
        "/api/site"
      );

    const db =
      await response.json();

    const settings =
      db.settings || {};

    document.querySelector(
      "#businessHours"
    ).value =
      settings.businessHours ||
      "12：00～04：00";

    document.querySelector(
      "#phone"
    ).value =
      settings.phone || "";

    document.querySelector(
      "#line"
    ).value =
      settings.line || "";

    renderPhotos(
      db.beauticians || []
    );

  }catch(error){

    alert(
      "資料讀取失敗：" +
      error.message
    );

  }

}


/* =========================
   顯示照片
========================= */

function renderPhotos(items){

  const todayGrid =
    document.querySelector(
      "#todayGrid"
    );

  const allGrid =
    document.querySelector(
      "#allGrid"
    );


  if(!items.length){

    const empty =
      `<div class="empty">
        目前沒有報班照片。
      </div>`;

    todayGrid.innerHTML =
      empty;

    allGrid.innerHTML =
      empty;

    return;
  }


  const html =
    items.map((item,index)=>`

      <div class="photoCard">

        <img
          src="${item.photo}"
          alt="報班照片"
        >

        <div class="photoInfo">

          <div class="photoName">
            ${item.name || `美容師${index+1}`}
          </div>

          <button
            class="danger"
            onclick="deletePhoto('${item.id}')"
          >
            🗑️ 刪除這張
          </button>

        </div>

      </div>

    `).join("");


  todayGrid.innerHTML =
    html;

  allGrid.innerHTML =
    html;

}


/* =========================
   選擇照片預覽
========================= */

function previewPhotos(){

  const input =
    document.querySelector(
      "#photoInput"
    );

  const preview =
    document.querySelector(
      "#preview"
    );

  const count =
    document.querySelector(
      "#photoCount"
    );

  const uploadBtn =
    document.querySelector(
      "#uploadBtn"
    );


  selectedFiles =
    Array.from(
      input.files
    );


  if(selectedFiles.length > 8){

    alert(
      "一次最多只能選擇 8 張照片。"
    );

    selectedFiles =
      selectedFiles.slice(0,8);

  }


  preview.innerHTML = "";


  selectedFiles.forEach(file=>{

    const url =
      URL.createObjectURL(file);

    preview.innerHTML += `
      <div class="previewItem">
        <img src="${url}">
      </div>
    `;

  });


  count.textContent =
    selectedFiles.length
    ? `已選擇 ${selectedFiles.length} 張照片`
    : "";


  uploadBtn.disabled =
    selectedFiles.length === 0;

}


/* =========================
   壓縮照片
========================= */

function compressImage(file){

  return new Promise(
    resolve => {

      const img =
        new Image();

      const reader =
        new FileReader();

      reader.onload =
        e => {

          img.onload =
            () => {

              const max =
                1000;

              let width =
                img.width;

              let height =
                img.height;


              if(width > max){

                height =
                  height *
                  max /
                  width;

                width =
                  max;

              }


              if(height > max){

                width =
                  width *
                  max /
                  height;

                height =
                  max;

              }


              const canvas =
                document.createElement(
                  "canvas"
                );

              canvas.width =
                Math.round(width);

              canvas.height =
                Math.round(height);


              const ctx =
                canvas.getContext(
                  "2d"
                );

              ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  0.65
                )
              );

            };


          img.src =
            e.target.result;

        };


      reader.readAsDataURL(file);

    }
  );

}


/* =========================
   批次上傳
========================= */

async function uploadPhotos(){

  if(!selectedFiles.length){

    return;
  }


  const btn =
    document.querySelector(
      "#uploadBtn"
    );

  const status =
    document.querySelector(
      "#uploadStatus"
    );


  btn.disabled =
    true;

  status.textContent =
    "照片處理中，請稍候...";


  try{

    const photos = [];


    for(
      const file of selectedFiles
    ){

      const compressed =
        await compressImage(file);

      photos.push(
        compressed
      );

    }


    status.textContent =
      "正在上傳照片...";


    const response =
      await fetch(
        "/api/beauticians/batch",
        {
          method:"POST",
          headers:authHeaders(),
          body:JSON.stringify({
            photos
          })
        }
      );


    const data =
      await response.json();


    if(!data.ok){

      throw new Error(
        data.message ||
        "上傳失敗"
      );

    }


    status.textContent =
      `成功上傳 ${data.added} 張照片。`;


    selectedFiles =
      [];

    document.querySelector(
      "#photoInput"
    ).value = "";

    document.querySelector(
      "#preview"
    ).innerHTML = "";

    document.querySelector(
      "#photoCount"
    ).textContent = "";

    await load();


  }catch(error){

    status.textContent =
      "上傳失敗：" +
      error.message;

  }


  btn.disabled =
    selectedFiles.length === 0;

}


/* =========================
   一鍵清除
========================= */

async function clearToday(){

  const ok =
    confirm(
      "確定要刪除目前所有報班照片嗎？\n\n這個動作無法復原。"
    );

  if(!ok){

    return;
  }


  const status =
    document.querySelector(
      "#clearStatus"
    );


  status.textContent =
    "清除中...";


  try{

    const response =
      await fetch(
        "/api/beauticians/today",
        {
          method:"DELETE",
          headers:authHeaders()
        }
      );


    const data =
      await response.json();


    if(!data.ok){

      throw new Error(
        data.message ||
        "清除失敗"
      );

    }


    status.textContent =
      `已清除 ${data.removed || 0} 張照片。`;


    await load();


  }catch(error){

    status.textContent =
      "清除失敗：" +
      error.message;

  }

}


/* =========================
   刪除單張
========================= */

async function deletePhoto(id){

  const ok =
    confirm(
      "確定要永久刪除這張照片嗎？"
    );

  if(!ok){

    return;
  }


  try{

    const response =
      await fetch(
        `/api/beauticians/${id}`,
        {
          method:"DELETE",
          headers:authHeaders()
        }
      );


    const data =
      await response.json();


    if(!data.ok){

      throw new Error(
        data.message ||
        "刪除失敗"
      );

    }


    await load();


  }catch(error){

    alert(
      "刪除失敗：" +
      error.message
    );

  }

}


/* =========================
   儲存店家資訊
========================= */

async function saveSettings(){

  const status =
    document.querySelector(
      "#settingsStatus"
    );


  status.textContent =
    "儲存中...";


  try{

    const body = {

      businessHours:
        document.querySelector(
          "#businessHours"
        ).value,

      phone:
        document.querySelector(
          "#phone"
        ).value,

      line:
        document.querySelector(
          "#line"
        ).value

    };


    const response =
      await fetch(
        "/api/settings",
        {
          method:"PUT",
          headers:authHeaders(),
          body:JSON.stringify(body)
        }
      );


    const data =
      await response.json();


    if(!data.ok){

      throw new Error(
        data.message ||
        "儲存失敗"
      );

    }


    status.textContent =
      "店家資訊已儲存。";


  }catch(error){

    status.textContent =
      "儲存失敗：" +
      error.message;

  }

}

</script>

</body>
</html>
