<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>莯浴 SPA｜管理後台</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f6f2ef;
  color:#282421;
  font-family:-apple-system,BlinkMacSystemFont,
  "Noto Sans TC","PingFang TC",
  "Microsoft JhengHei",sans-serif;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:20px 14px 50px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.top h1{
  font-size:23px;
  margin:5px 0;
}

.top a{
  color:#6f665f;
  text-decoration:none;
}

.panel{
  background:#fff;
  border:1px solid #e5ddd7;
  border-radius:18px;
  padding:18px;
  margin:16px 0;
}

.panel h2{
  margin-top:0;
}

input,
button{
  font:inherit;
}

input[type="password"],
input[type="text"]{
  width:100%;
  padding:12px;
  border:1px solid #d8cec7;
  border-radius:10px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  background:#2b2724;
  color:white;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.hidden{
  display:none !important;
}

.muted{
  color:#7c736c;
  font-size:13px;
  line-height:1.6;
}


/* 批次照片區 */

.photo-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:15px;
}

.photo-card{
  border:1px solid #e5ddd7;
  border-radius:14px;
  padding:12px;
  background:#faf8f6;
}

.photo-number{
  font-weight:700;
  margin-bottom:9px;
}

.photo-input{
  width:100%;
  padding:9px;
  background:white;
  border:1px solid #d8cec7;
  border-radius:9px;
}

.preview{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:12px;
  margin-top:10px;
  background:#eee8e3;
}

.empty-preview{
  width:100%;
  aspect-ratio:1/1;
  border-radius:12px;
  margin-top:10px;
  background:#eee8e3;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#8b8179;
  font-size:13px;
}

.batch-actions{
  margin-top:16px;
}

.status{
  margin-top:12px;
  padding:10px;
  border-radius:10px;
  background:#f5f0ec;
  color:#625951;
  font-size:13px;
}


/* 已有照片 */

.existing-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.existing-item{
  position:relative;
}

.existing-item img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:12px;
}

.delete-btn{
  width:100%;
  margin-top:6px;
  padding:8px;
  background:#8a3f35;
  font-size:13px;
}


@media(max-width:650px){

  .photo-grid{
    grid-template-columns:1fr 1fr;
  }

  .existing-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .top h1{
    font-size:20px;
  }

}
</style>
</head>


<body>

<div class="wrap">


<!-- 頂部 -->

<div class="top">

  <h1>莯浴 SPA｜管理後台</h1>

  <a href="/">
    ← 回網站
  </a>

</div>


<!-- 登入 -->

<div id="login" class="panel">

  <h2>管理員登入</h2>

  <input
    id="pw"
    type="password"
    placeholder="管理員密碼"
  >

  <button
    onclick="login()"
    style="width:100%;margin-top:12px"
  >
    登入
  </button>

</div>


<!-- 後台 -->

<div id="app" class="hidden">


<!-- 店家設定 -->

<div class="panel">

  <h2>店家設定</h2>

  <label class="muted">
    營業時間
  </label>

  <input
    id="hours"
    type="text"
    value="12:00～04:00"
  >

  <label class="muted"
         style="display:block;margin-top:12px">
    電話
  </label>

  <input
    id="phone"
    type="text"
  >

  <label class="muted"
         style="display:block;margin-top:12px">
    LINE
  </label>

  <input
    id="line"
    type="text"
  >

  <button
    onclick="saveSettings()"
    style="width:100%;margin-top:12px"
  >
    儲存店家設定
  </button>

</div>


<!-- 批次新增 -->

<div class="panel">

  <h2>📷 今日報班｜批次新增</h2>

  <div class="muted">
    一次最多選擇 8 張美容師照片。
    選完後按「一次上傳全部」。
  </div>


  <div class="photo-grid">


    <!-- 1 -->

    <div class="photo-card">

      <div class="photo-number">
        ①
      </div>

      <input
        class="photo-input"
        type="file"
        accept="image/*"
        onchange="previewPhoto(this,1)"
      >

      <div id="empty1"
           class="empty-preview">
        尚未選擇照片
      </div>

      <img
        id="preview1"
        class="preview hidden"
      >

    </div>


    <!-- 2 -->

    <div class="photo-card">

      <div class="photo-number">
        ②
      </div>

      <input
        class="photo-input"
        type="file"
        accept="image/*"
        onchange="previewPhoto(this,2)"
      >

      <div id="empty2"
           class="empty-preview">
        尚未選擇照片
      </div>

      <img
        id="preview2"
        class="preview hidden"
      >

    </div>


    <!-- 3 -->

    <div class="photo-card">

      <div class="photo-number">
        ③
      </div>

      <input
        class="photo-input"
        type="file"
        accept="image/*"
        onchange="previewPhoto(this,3)"
      >

      <div id="empty3"
           class="empty-preview">
        尚未選擇照片
      </div>

      <img
        id="preview3"
        class="preview hidden"
      >

    </div>


    <!-- 4 -->

    <div class="photo-card">

      <div class="photo-number">
        ④
      </div>

      <input
        class="photo-input"
        type="file"
        accept="image/*"
        onchange="previewPhoto(this,4)"
      >

      <div id="empty4"
           class="empty-preview">
        尚未選擇照片
      </div>

      <img
        id="preview4"
        class="preview hidden"
      >

    </div>


    <!-- 5 -->

    <div class="photo-card">

      <div class="photo-number">
        ⑤
      </div>

      <input
        class="photo-input"
        type="file"
        accept="image/*"
        onchange="previewPhoto(this,5)"
      >

      <div id="empty5"
           class="empty-preview">
        尚未選擇照片
      </div>

      <img
        id="preview5"
        class="preview hidden"
      >

    </div>


    <!-- 6 -->

    <div class="photo-card">

      <div class="photo-number">
        ⑥
      </div>

      <input
        class="photo-input"
        type="file"
        accept="image/*"
        onchange="previewPhoto(this,6)"
      >

      <div id="empty6"
           class="empty-preview">
        尚未選擇照片
      </div>

      <img
        id="preview6"
        class="preview hidden"
      >

    </div>


    <!-- 7 -->

    <div class="photo-card">

      <div class="photo-number">
        ⑦
      </div>

      <input
        class="photo-input"
        type="file"
        accept="image/*"
        onchange="previewPhoto(this,7)"
      >

      <div id="empty7"
           class="empty-preview">
        尚未選擇照片
      </div>

      <img
        id="preview7"
        class="preview hidden"
      >

    </div>


    <!-- 8 -->

    <div class="photo-card">

      <div class="photo-number">
        ⑧
      </div>

      <input
        class="photo-input"
        type="file"
        accept="image/*"
        onchange="previewPhoto(this,8)"
      >

      <div id="empty8"
           class="empty-preview">
        尚未選擇照片
      </div>

      <img
        id="preview8"
        class="preview hidden"
      >

    </div>


  </div>


  <div class="batch-actions">

    <button
      id="uploadBtn"
      onclick="uploadAll()"
      style="width:100%"
    >
      📤 一次上傳全部
    </button>

  </div>


  <div
    id="status"
    class="status hidden"
  ></div>

</div>


<!-- 已有照片 -->

<div class="panel">

  <h2>🖼️ 目前今日報班</h2>

  <div
    id="list"
    class="existing-grid"
  >
    載入中...
  </div>

</div>


</div>

</div>


<script>

let token =
  localStorage.muyuToken || "";

let db;

const $ =
  selector =>
    document.querySelector(selector);


/* =========================
   Authorization
========================= */

function headers(){

  return {
    "Authorization":
      "Bearer " + token
  };

}


/* =========================
   登入
========================= */

async function login(){

  const password =
    $("#pw").value;

  if(!password){

    alert("請輸入管理員密碼");

    return;
  }

  try{

    const response =
      await fetch(
        "/api/login",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              password
            })
        }
      );

    if(!response.ok){

      alert("密碼錯誤");

      return;
    }

    const data =
      await response.json();

    token =
      data.token;

    localStorage.muyuToken =
      token;

    showApp();

  }catch(error){

    alert(
      "無法連線到網站"
    );

  }

}


/* =========================
   顯示後台
========================= */

function showApp(){

  $("#login")
    .classList
    .add("hidden");

  $("#app")
    .classList
    .remove("hidden");

  load();

}


/* =========================
   載入資料
========================= */

async function load(){

  try{

    const response =
      await fetch(
        "/api/site"
      );

    if(!response.ok){

      alert(
        "網站資料讀取失敗"
      );

      return;
    }

    db =
      await response.json();


    $("#hours").value =
      db.settings.businessHours ||
      "12:00～04:00";

    $("#phone").value =
      db.settings.phone || "";

    $("#line").value =
      db.settings.line || "";


    renderPhotos();

  }catch(error){

    alert(
      "資料載入失敗"
    );

  }

}


/* =========================
   顯示照片
========================= */

function renderPhotos(){

  const list =
    $("#list");

  const photos =
    db.beauticians
      .filter(x => x.photo);


  if(!photos.length){

    list.innerHTML =
      '<div class="muted">目前沒有照片</div>';

    return;
  }


  list.innerHTML =
    photos.map(
      (x,index) => `

        <div class="existing-item">

          <img
            src="${x.photo}"
            alt="美容師照片"
          >

          <button
            class="delete-btn"
            onclick="deletePhoto('${x.id}')"
          >
            🗑 刪除
          </button>

        </div>

      `
    ).join("");

}


/* =========================
   照片預覽
========================= */

function previewPhoto(input,number){

  const file =
    input.files[0];

  const preview =
    $("#preview" + number);

  const empty =
    $("#empty" + number);


  if(!file){

    preview
      .classList
      .add("hidden");

    empty
      .classList
      .remove("hidden");

    return;
  }


  const url =
    URL.createObjectURL(file);

  preview.src =
    url;

  preview
    .classList
    .remove("hidden");

  empty
    .classList
    .add("hidden");

}


/* =========================
   圖片壓縮
========================= */

function compressImage(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload =
        event => {

          const img =
            new Image();

          img.onload =
            () => {

              const max =
                1200;

              let width =
                img.width;

              let height =
                img.height;


              if(
                width > max ||
                height > max
              ){

                if(width > height){

                  height =
                    height *
                    max /
                    width;

                  width =
                    max;

                }else{

                  width =
                    width *
                    max /
                    height;

                  height =
                    max;

                }

              }


              const canvas =
                document
                .createElement(
                  "canvas"
                );

              canvas.width =
                Math.round(width);

              canvas.height =
                Math.round(height);


              const ctx =
                canvas
                .getContext("2d");


              ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  0.75
                )
              );

            };


          img.onerror =
            reject;

          img.src =
            event.target.result;

        };


      reader.onerror =
        reject;

      reader.readAsDataURL(file);

    }
  );

}


/* =========================
   批次上傳
========================= */

async function uploadAll(){

  const files = [];


  for(
    let i = 1;
    i <= 8;
    i++
  ){

    const input =
      document
      .querySelector(
        `.photo-card:nth-child(${i}) .photo-input`
      );

    if(
      input &&
      input.files &&
      input.files[0]
    ){

      files.push(
        input.files[0]
      );

    }

  }


  if(!files.length){

    alert(
      "請先選擇至少一張照片"
    );

    return;
  }


  const button =
    $("#uploadBtn");

  const status =
    $("#status");


  button.disabled =
    true;

  button.textContent =
    "⏳ 處理照片中...";

  status
    .classList
    .remove("hidden");


  try{

    for(
      let i = 0;
      i < files.length;
      i++
    ){

      status.textContent =
        `正在處理第 ${i+1} / ${files.length} 張照片...`;


      const photo =
        await compressImage(
          files[i]
        );


      const response =
        await fetch(
          "/api/beauticians",
          {
            method:"POST",

            headers:{
              ...headers(),
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                name:
                  "美容師",
                today:true,
                photo
              })
          }
        );


      if(!response.ok){

        const data =
          await response
          .json()
          .catch(
            () => ({})
          );

        throw new Error(
          data.error ||
          "上傳失敗"
        );

      }

    }


    status.textContent =
      `完成！共處理 ${files.length} 張照片。`;


    alert(
      `已完成 ${files.length} 張照片`
    );


    clearPhotoInputs();

    await load();


  }catch(error){

    console.error(error);

    status.textContent =
      "上傳過程發生錯誤。";

    alert(
      "照片上傳失敗：" +
      error.message
    );


  }finally{

    button.disabled =
      false;

    button.textContent =
      "📤 一次上傳全部";

  }

}


/* =========================
   清除照片選擇
========================= */

function clearPhotoInputs(){

  document
    .querySelectorAll(
      ".photo-input"
    )
    .forEach(
      input => {
        input.value = "";
      }
    );


  for(
    let i = 1;
    i <= 8;
    i++
  ){

    $("#preview" + i)
      .classList
      .add("hidden");

    $("#empty" + i)
      .classList
      .remove("hidden");

  }

}


/* =========================
   刪除
========================= */

async function deletePhoto(id){

  if(
    !confirm(
      "確定要刪除這張照片嗎？"
    )
  ){

    return;
  }


  try{

    const response =
      await fetch(
        "/api/beauticians/" + id,
        {
          method:"DELETE",
          headers:headers()
        }
      );


    if(!response.ok){

      alert(
        "刪除失敗"
      );

      return;
    }


    await load();

  }catch(error){

    alert(
      "刪除失敗"
    );

  }

}


/* =========================
   店家設定
========================= */

async function saveSettings(){

  try{

    const response =
      await fetch(
        "/api/settings",
        {
          method:"POST",

          headers:{
            ...headers(),
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              businessHours:
                $("#hours").value,

              phone:
                $("#phone").value,

              line:
                $("#line").value

            })
        }
      );


    if(!response.ok){

      alert(
        "儲存失敗"
      );

      return;
    }


    alert(
      "店家設定已儲存"
    );

  }catch(error){

    alert(
      "儲存失敗"
    );

  }

}


/* =========================
   自動登入
========================= */

if(token){

  showApp();

}

</script>

</body>
</html>
