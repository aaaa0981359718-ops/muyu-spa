<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>莯浴 SPA｜管理後台</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f6f2ef;
  color:#282421;
  font-family:-apple-system,BlinkMacSystemFont,
  "Noto Sans TC","PingFang TC",
  "Microsoft JhengHei",sans-serif;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:20px 14px 50px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.top h1{
  font-size:22px;
}

.top a{
  color:#6f665f;
  text-decoration:none;
}

.panel{
  background:#fff;
  border:1px solid #e5ddd7;
  border-radius:18px;
  padding:18px;
  margin:16px 0;
}

button{
  width:100%;
  border:0;
  border-radius:11px;
  padding:13px;
  background:#2b2724;
  color:#fff;
  font-weight:700;
  font-size:16px;
}

button:disabled{
  opacity:.5;
}

input[type="password"],
input[type="text"]{
  width:100%;
  padding:12px;
  border:1px solid #d8cec7;
  border-radius:10px;
}

.muted{
  color:#7c736c;
  font-size:13px;
  line-height:1.6;
}

.hidden{
  display:none!important;
}

/* 選照片 */
.select-area{
  border:2px dashed #cfc3ba;
  border-radius:15px;
  padding:22px 15px;
  text-align:center;
  background:#faf8f6;
  margin-top:15px;
}

.select-area input{
  width:100%;
  margin-top:12px;
}

.selected-count{
  margin-top:12px;
  font-weight:700;
}

.preview-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:15px;
}

.preview-item{
  position:relative;
}

.preview-item img{
  display:block;
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:12px;
}

.number{
  position:absolute;
  top:6px;
  left:6px;
  background:#2b2724;
  color:#fff;
  border-radius:20px;
  padding:4px 8px;
  font-size:12px;
}

/* 現有照片 */
.existing-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.existing-item img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:12px;
}

.delete{
  margin-top:5px;
  padding:8px;
  font-size:13px;
  background:#8a3f35;
}

.status{
  margin-top:12px;
  padding:10px;
  border-radius:10px;
  background:#f5f0ec;
  font-size:13px;
}

@media(max-width:650px){

  .preview-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .existing-grid{
    grid-template-columns:repeat(2,1fr);
  }

}
</style>
</head>

<body>

<div class="wrap">

<div class="top">
  <h1>莯浴 SPA｜管理後台</h1>
  <a href="/">← 回網站</a>
</div>


<!-- 登入 -->

<div id="login" class="panel">

  <h2>管理員登入</h2>

  <input
    id="pw"
    type="password"
    placeholder="管理員密碼"
  >

  <button
    onclick="login()"
    style="margin-top:12px"
  >
    登入
  </button>

</div>


<!-- 後台 -->

<div id="app" class="hidden">


<!-- 店家設定 -->

<div class="panel">

  <h2>店家設定</h2>

  <label class="muted">
    營業時間
  </label>

  <input
    id="hours"
    type="text"
    value="12:00～04:00"
  >

  <label
    class="muted"
    style="display:block;margin-top:12px"
  >
    電話
  </label>

  <input
    id="phone"
    type="text"
  >

  <label
    class="muted"
    style="display:block;margin-top:12px"
  >
    LINE
  </label>

  <input
    id="line"
    type="text"
  >

  <button
    onclick="saveSettings()"
    style="margin-top:12px"
  >
    儲存店家設定
  </button>

</div>


<!-- 今日報班 -->

<div class="panel">

  <h2>📷 今日報班照片</h2>

  <div class="muted">
    不需要輸入編號、國籍、時間或介紹。
    <br>
    一次最多選擇 8 張照片。
  </div>


  <div class="select-area">

    <strong>
      一次選擇多張照片
    </strong>

    <div class="muted">
      點擊下面按鈕後，在手機相簿一次勾選多張。
    </div>

    <input
      id="photos"
      type="file"
      accept="image/*"
      multiple
      onchange="selectPhotos(event)"
    >

    <div
      id="count"
      class="selected-count"
    >
      尚未選擇照片
    </div>

  </div>


  <div
    id="preview"
    class="preview-grid"
  ></div>


  <button
    id="upload"
    onclick="uploadPhotos()"
    style="margin-top:15px"
  >
    📤 一次上傳全部照片
  </button>


  <div
    id="status"
    class="status hidden"
  ></div>

</div>


<!-- 已有照片 -->

<div class="panel">

  <h2>🖼️ 目前照片</h2>

  <div
    id="list"
    class="existing-grid"
  >
    載入中...
  </div>

</div>


</div>

</div>


<script>

let token =
  localStorage.muyuToken || "";

let db = null;

let selectedFiles = [];


/* =========================
   API
========================= */

function authHeaders(){

  return {
    "Authorization":
      "Bearer " + token
  };

}


/* =========================
   登入
========================= */

async function login(){

  const password =
    document
      .getElementById("pw")
      .value
      .trim();

  if(!password){

    alert("請輸入管理員密碼");

    return;
  }


  try{

    const r =
      await fetch(
        "/api/login",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              password
            })
        }
      );


    const data =
      await r.json();


    if(!r.ok){

      alert(
        data.error ||
        "密碼錯誤"
      );

      return;
    }


    token =
      data.token;

    localStorage.muyuToken =
      token;


    showApp();


  }catch(e){

    alert(
      "無法連線到伺服器"
    );

  }

}


/* =========================
   顯示後台
========================= */

function showApp(){

  document
    .getElementById("login")
    .classList
    .add("hidden");

  document
    .getElementById("app")
    .classList
    .remove("hidden");

  load();

}


/* =========================
   載入資料
========================= */

async function load(){

  try{

    const r =
      await fetch(
        "/api/site"
      );


    if(!r.ok){

      throw new Error(
        "資料讀取失敗"
      );

    }


    db =
      await r.json();


    document
      .getElementById("hours")
      .value =
      db.settings?.businessHours ||
      "12:00～04:00";


    document
      .getElementById("phone")
      .value =
      db.settings?.phone || "";


    document
      .getElementById("line")
      .value =
      db.settings?.line || "";


    renderExisting();


  }catch(e){

    alert(
      "資料讀取失敗"
    );

  }

}


/* =========================
   選擇照片
========================= */

function selectPhotos(event){

  const files =
    Array.from(
      event.target.files || []
    );


  if(files.length === 0){

    selectedFiles = [];

    document
      .getElementById("count")
      .textContent =
      "尚未選擇照片";

    document
      .getElementById("preview")
      .innerHTML =
      "";

    return;
  }


  if(files.length > 8){

    alert(
      "一次最多選擇 8 張照片"
    );

    event.target.value = "";

    selectedFiles = [];

    document
      .getElementById("count")
      .textContent =
      "尚未選擇照片";

    document
      .getElementById("preview")
      .innerHTML =
      "";

    return;
  }


  selectedFiles =
    files;


  document
    .getElementById("count")
    .textContent =
    `已選擇 ${files.length} 張照片`;


  const preview =
    document
      .getElementById("preview");


  preview.innerHTML =
    "";


  files.forEach(
    (file,index) => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "preview-item";


      const number =
        document.createElement(
          "div"
        );

      number.className =
        "number";

      number.textContent =
        index + 1;


      const img =
        document.createElement(
          "img"
        );


      img.src =
        URL.createObjectURL(
          file
        );


      item.appendChild(number);

      item.appendChild(img);

      preview.appendChild(item);

    }
  );

}


/* =========================
   壓縮照片
========================= */

function compressImage(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();


      reader.onload =
        function(e){

          const img =
            new Image();


          img.onload =
            function(){

              const maxSize =
                1000;

              let width =
                img.width;

              let height =
                img.height;


              if(
                width > maxSize ||
                height > maxSize
              ){

                if(width >= height){

                  height =
                    height *
                    maxSize /
                    width;

                  width =
                    maxSize;

                }else{

                  width =
                    width *
                    maxSize /
                    height;

                  height =
                    maxSize;

                }

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                Math.round(width);

              canvas.height =
                Math.round(height);


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
              );


              const result =
                canvas.toDataURL(
                  "image/jpeg",
                  0.65
                );


              resolve(result);

            };


          img.onerror =
            reject;

          img.src =
            e.target.result;

        };


      reader.onerror =
        reject;

      reader.readAsDataURL(file);

    }
  );

}


/* =========================
   批次上傳
========================= */

async function uploadPhotos(){

  if(!selectedFiles.length){

    alert(
      "請先選擇照片"
    );

    return;
  }


  const button =
    document
      .getElementById("upload");


  const status =
    document
      .getElementById("status");


  button.disabled =
    true;

  status.classList
    .remove("hidden");


  try{

    const photos = [];


    for(
      let i = 0;
      i < selectedFiles.length;
      i++
    ){

      status.textContent =
        `正在處理照片 ${i+1} / ${selectedFiles.length}...`;


      const photo =
        await compressImage(
          selectedFiles[i]
        );


      photos.push(photo);

    }


    status.textContent =
      "正在一次儲存全部照片...";


    const r =
      await fetch(
        "/api/beauticians/batch",
        {
          method:"POST",

          headers:{
            ...authHeaders(),

            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              photos
            })
        }
      );


    const data =
      await r.json();


    if(!r.ok){

      throw new Error(
        data.error ||
        "照片儲存失敗"
      );

    }


    status.textContent =
      `完成！已新增 ${photos.length} 張照片。`;


    alert(
      `成功新增 ${photos.length} 張照片`
    );


    document
      .getElementById("photos")
      .value =
      "";

    selectedFiles = [];


    document
      .getElementById("count")
      .textContent =
      "尚未選擇照片";


    document
      .getElementById("preview")
      .innerHTML =
      "";


    await load();


  }catch(e){

    console.error(e);

    status.textContent =
      "上傳失敗";


    alert(
      "上傳失敗：" +
      e.message
    );


  }finally{

    button.disabled =
      false;

  }

}


/* =========================
   顯示現有照片
========================= */

function renderExisting(){

  const list =
    document
      .getElementById("list");


  const photos =
    (db.beauticians || [])
      .filter(
        x => x.photo
      );


  if(!photos.length){

    list.innerHTML =
      '<div class="muted">目前沒有照片</div>';

    return;
  }


  list.innerHTML =
    photos
      .map(
        x => `

        <div class="existing-item">

          <img
            src="${x.photo}"
            alt="美容師照片"
          >

          <button
            class="delete"
            onclick="deletePhoto('${x.id}')"
          >
            🗑 刪除
          </button>

        </div>

        `
      )
      .join("");

}


/* =========================
   刪除照片
========================= */

async function deletePhoto(id){

  if(
    !confirm(
      "確定要刪除這張照片嗎？"
    )
  ){

    return;
  }


  try{

    const r =
      await fetch(
        "/api/beauticians/" + id,
        {
          method:"DELETE",

          headers:
            authHeaders()
        }
      );


    const data =
      await r.json();


    if(!r.ok){

      throw new Error(
        data.error ||
        "刪除失敗"
      );

    }


    await load();


  }catch(e){

    alert(
      "刪除失敗：" +
      e.message
    );

  }

}


/* =========================
   儲存店家設定
========================= */

async function saveSettings(){

  try{

    const r =
      await fetch(
        "/api/settings",
        {
          method:"POST",

          headers:{
            ...authHeaders(),

            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              businessHours:
                document
                  .getElementById("hours")
                  .value,

              phone:
                document
                  .getElementById("phone")
                  .value,

              line:
                document
                  .getElementById("line")
                  .value

            })
        }
      );


    const data =
      await r.json();


    if(!r.ok){

      throw new Error(
        data.error ||
        "儲存失敗"
      );

    }


    alert(
      "店家設定已儲存"
    );


  }catch(e){

    alert(
      "儲存失敗：" +
      e.message
    );

  }

}


/* =========================
   自動登入
========================= */

if(token){

  showApp();

}

</script>

</body>
</html>
