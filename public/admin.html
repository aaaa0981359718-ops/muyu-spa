<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>No.66 報班管理後台</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f5f0;
  color: #393630;
  font-family: Arial, "Noto Sans TC", sans-serif;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 24px 18px 50px;
}

h1 {
  font-size: 25px;
  letter-spacing: 2px;
  margin-bottom: 6px;
}

.subtitle {
  color: #999184;
  font-size: 13px;
  margin-bottom: 26px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 3px 15px #00000008;
}

h2 {
  font-size: 17px;
  margin: 0 0 18px;
}

label {
  display: block;
  font-size: 14px;
  margin: 16px 0 7px;
}

input, select {
  width: 100%;
  height: 48px;
  border: 1px solid #e4dfd5;
  border-radius: 8px;
  padding: 0 12px;
  font-size: 16px;
  background: #fff;
  color: #393630;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 13px 17px;
  font-size: 15px;
  cursor: pointer;
}

.primary {
  width: 100%;
  background: #827965;
  color: white;
  margin-top: 20px;
}

.secondary {
  background: #eeeae2;
  color: #514b40;
}

.danger {
  background: #f8e8e5;
  color: #a34f45;
}

.hidden {
  display: none !important;
}

.shift {
  border-top: 1px solid #eeeae2;
  padding: 17px 0;
}

.shift:first-child {
  border-top: 0;
}

.shift-date {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 7px;
}

.shift-info {
  color: #777064;
  font-size: 14px;
  line-height: 1.8;
}

.shift-actions {
  display: flex;
  gap: 9px;
  margin-top: 12px;
}

.shift-actions button {
  flex: 1;
}

.empty {
  text-align: center;
  padding: 25px 0;
  color: #aaa397;
}

#message {
  font-size: 14px;
  margin-top: 12px;
  color: #827965;
  text-align: center;
}

.login-box {
  margin-top: 70px;
}
</style>
</head>

<body>

<div class="container">

  <div id="loginArea" class="login-box">
    <div class="card">
      <h1>No.66 管理後台</h1>
      <p class="subtitle">個人報班管理系統</p>

      <label>管理密碼</label>
      <input
        type="password"
        id="password"
        placeholder="請輸入管理密碼"
      >

      <button class="primary" onclick="login()">
        登入管理後台
      </button>

      <div id="loginMessage"></div>
    </div>
  </div>

  <div id="adminArea" class="hidden">

    <h1>No.66 報班管理</h1>
    <p class="subtitle">隨時管理你的上班日期與時間</p>

    <div class="card">

      <h2 id="formTitle">新增報班</h2>

      <label>上班日期</label>
      <input type="date" id="date">

      <label>開始時間</label>
      <input type="time" id="startTime">

      <label>結束時間</label>
      <input type="time" id="endTime">

      <label>上班店家</label>
      <select id="storeId">
        <option value="muyu">莯浴 SPA 養生館</option>
        <option value="huanhuan">歡歡 SPA</option>
        <option value="dream17">夢十七</option>
      </select>

      <button class="primary" onclick="saveShift()">
        儲存報班
      </button>

      <button
        id="cancelEdit"
        class="secondary hidden"
        style="width:100%;margin-top:10px"
        onclick="resetForm()"
      >
        取消修改
      </button>

      <div id="message"></div>

    </div>

    <div class="card">
      <h2>目前所有報班</h2>
      <div id="shiftList">
        <div class="empty">載入中...</div>
      </div>
    </div>

    <button
      class="secondary"
      style="width:100%"
      onclick="logout()"
    >
      登出管理後台
    </button>

  </div>

</div>

<script>
let token = localStorage.getItem("muyu_admin_token") || "";
let editingId = null;
let shifts = [];
let stores = {};

function authHeaders() {
  return {
    "Content-Type": "application/json",
    "Authorization": "Bearer " + token
  };
}

async function login() {
  const password =
    document.getElementById("password").value;

  if (!password) {
    document.getElementById("loginMessage").textContent =
      "請輸入管理密碼";
    return;
  }

  try {
    const response = await fetch("/api/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ password })
    });

    const data = await response.json();

    if (!data.ok) {
      document.getElementById("loginMessage").textContent =
        data.message || "登入失敗";
      return;
    }

    token = data.token;

    localStorage.setItem("muyu_admin_token", token);

    await openAdmin();

  } catch (error) {
    document.getElementById("loginMessage").textContent =
      "連線失敗，請稍後再試";
  }
}

async function openAdmin() {
  try {
    const response = await fetch("/api/site");

    if (!response.ok) {
      throw new Error("網站資料讀取失敗");
    }

    const data = await response.json();

    stores = data.stores || {};

    document.getElementById("loginArea")
      .classList.add("hidden");

    document.getElementById("adminArea")
      .classList.remove("hidden");

    await loadShifts();

  } catch (error) {
    logout();
  }
}

async function loadShifts() {
  const response = await fetch("/api/site");

  const data = await response.json();

  shifts = data.shifts || [];
  stores = data.stores || {};

  renderShifts();
}

function formatDate(date) {
  const parts = date.split("-");

  return Number(parts[1]) + "/" + Number(parts[2]);
}

function renderShifts() {
  const list = document.getElementById("shiftList");

  if (!shifts.length) {
    list.innerHTML =
      '<div class="empty">目前沒有報班資料</div>';
    return;
  }

  list.innerHTML = "";

  shifts.forEach(item => {
    const store = stores[item.storeId] || {};

    const div = document.createElement("div");
    div.className = "shift";

    const date = document.createElement("div");
    date.className = "shift-date";
    date.textContent = formatDate(item.date);

    const info = document.createElement("div");
    info.className = "shift-info";
    info.textContent =
      item.startTime + " ～ " + item.endTime +
      "｜" + (store.name || "");

    const actions = document.createElement("div");
    actions.className = "shift-actions";

    const edit = document.createElement("button");
    edit.className = "secondary";
    edit.textContent = "修改";
    edit.onclick = () => editShift(item);

    const del = document.createElement("button");
    del.className = "danger";
    del.textContent = "刪除";
    del.onclick = () => deleteShift(item.id);

    actions.append(edit, del);

    div.append(date, info, actions);

    list.appendChild(div);
  });
}

async function saveShift() {
  const body = {
    date: document.getElementById("date").value,
    startTime: document.getElementById("startTime").value,
    endTime: document.getElementById("endTime").value,
    storeId: document.getElementById("storeId").value
  };

  const message = document.getElementById("message");

  if (
    !body.date ||
    !body.startTime ||
    !body.endTime
  ) {
    message.textContent = "請完整填寫日期與時間";
    return;
  }

  if (body.endTime <= body.startTime) {
    message.textContent = "結束時間必須晚於開始時間";
    return;
  }

  try {
    const url = editingId
      ? "/api/shifts/" + editingId
      : "/api/shifts";

    const response = await fetch(url, {
      method: editingId ? "PUT" : "POST",
      headers: authHeaders(),
      body: JSON.stringify(body)
    });

    const data = await response.json();

    if (!data.ok) {
      message.textContent =
        data.message || "儲存失敗";
      return;
    }

    message.textContent = "儲存成功！";

    resetForm();

    await loadShifts();

  } catch (error) {
    message.textContent = "連線失敗，請稍後再試";
  }
}

function editShift(item) {
  editingId = item.id;

  document.getElementById("date").value =
    item.date;

  document.getElementById("startTime").value =
    item.startTime;

  document.getElementById("endTime").value =
    item.endTime;

  document.getElementById("storeId").value =
    item.storeId;

  document.getElementById("formTitle").textContent =
    "修改報班";

  document.getElementById("cancelEdit")
    .classList.remove("hidden");

  document.getElementById("message").textContent =
    "正在修改這筆報班";

  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function deleteShift(id) {
  if (!confirm("確定要刪除這筆報班嗎？")) {
    return;
  }

  try {
    const response = await fetch(
      "/api/shifts/" + id,
      {
        method: "DELETE",
        headers: authHeaders()
      }
    );

    const data = await response.json();

    if (!data.ok) {
      alert(data.message || "刪除失敗");
      return;
    }

    await loadShifts();

    document.getElementById("message").textContent =
      "刪除成功";

  } catch (error) {
    alert("連線失敗，請稍後再試");
  }
}

function resetForm() {
  editingId = null;

  document.getElementById("date").value = "";
  document.getElementById("startTime").value = "";
  document.getElementById("endTime").value = "";
  document.getElementById("storeId").value = "muyu";

  document.getElementById("formTitle").textContent =
    "新增報班";

  document.getElementById("cancelEdit")
    .classList.add("hidden");

  document.getElementById("message").textContent = "";
}

function logout() {
  localStorage.removeItem("muyu_admin_token");

  token = "";

  document.getElementById("adminArea")
    .classList.add("hidden");

  document.getElementById("loginArea")
    .classList.remove("hidden");
}

if (token) {
  openAdmin();
}
</script>

</body>
</html>
