<body>

  <main class="container">

    <header>
      <div class="brand">No.66</div>
      <div class="subtitle">TAiNAN · SPA · RELAX</div>
      <div class="header-line"></div>
    </header>

    <section class="hero">

      <div class="photo-wrap">
        <img
          src="/MEITU_20261106_010809741.jpg"
          alt="No.66 美容師照片"
        >
      </div>

      <div class="hero-info">
        <div class="number">NO. 66</div>

        <h1 class="hero-title">
          台南按摩・SPA・養生館
        </h1>

        <div class="hero-desc">
          上班資訊　・　預約方式
        </div>
      </div>

    </section>

    <section>

      <div class="section-title">
        <h2>最新報班</h2>
        <p>SCHEDULE</p>
      </div>

      <div id="schedule">
        <div class="empty">
          報班資訊載入中...
        </div>
      </div>

    </section>

    <footer class="footer-box">

      <div class="footer-title">
        CONTACT
      </div>

      <div>
        如需客製化網站可私訊聯絡我
      </div>

      <div style="margin-top:8px;">
        LINE：
        <a
          href="https://line.me/R/ti/p/~handsome_boy930"
          target="_blank"
          rel="noopener"
        >
          handsome_boy930
        </a>
      </div>

      </div>

      </div>

    </footer>

  </main>

  <script>
    const scheduleBox = document.getElementById("schedule");

    function formatDate(dateString) {
      const parts = dateString.split("-");
      return Number(parts[1]) + "/" + Number(parts[2]);
    }

    function createContactButtons(store) {
      let buttons = "";

      if (store.line) {
        buttons += `
          <a
            class="contact-btn"
            href="https://line.me/R/ti/p/~${encodeURIComponent(store.line)}"
            target="_blank"
            rel="noopener"
          >
            LINE 預約
          </a>
        `;
      }

      if (store.phone) {
        buttons += `
          <a
            class="contact-btn phone"
            href="tel:${store.phone}"
          >
            電話預約
          </a>
        `;
      }

      return buttons;
    }

    async function loadSchedule() {
      try {
        const response = await fetch("/api/site", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("資料載入失敗");
        }

        const data = await response.json();

        const shifts = Array.isArray(data.shifts)
          ? data.shifts
          : [];

        const stores = data.stores || {};

        if (shifts.length === 0) {
          scheduleBox.innerHTML = `
            <div class="empty">
              目前尚未公告報班
              <small>PLEASE CHECK BACK LATER</small>
            </div>
          `;
          return;
        }

        shifts.sort((a, b) => {
          const dateCompare = a.date.localeCompare(b.date);

          if (dateCompare !== 0) {
            return dateCompare;
          }

          return a.startTime.localeCompare(b.startTime);
        });

        scheduleBox.innerHTML = shifts.map(item => {
          const store = stores[item.storeId];

          if (!store) {
            return "";
          }

          return `
            <article class="shift-card">

              <div class="shift-top">
                <div class="shift-date">
                  ${formatDate(item.date)}
                </div>

                <div class="shift-label">
                  AVAILABLE
                </div>
              </div>

              <div class="shift-time">
                ⏰ ${item.startTime} ～ ${item.endTime}
              </div>

              <div class="store-name">
                ${store.name}
              </div>

              <div class="contact-row">
                ${createContactButtons(store)}
              </div>

            </article>
          `;
        }).join("");

      } catch (error) {
        scheduleBox.innerHTML = `
          <div class="empty">
            報班資訊暫時無法載入
            <small>PLEASE TRY AGAIN LATER</small>
          </div>
        `;
      }
    }

    loadSchedule();
  </script>
