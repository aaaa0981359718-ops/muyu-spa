<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta name="description" content="台南按摩、SPA、養生館資訊。查看 No.66 美容師最新上班地點、服務時間與預約聯絡方式。">

  <meta name="google-site-verification" content="1_h-Rc37X0xDk6R0eHd1ROjOCPkMIPsFoFSDODGPJqI" />

  <meta name="robots" content="index, follow">

  <meta name="theme-color" content="#f8f4ef">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: #f8f5f1;
      color: #514943;
      line-height: 1.7;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: auto;
      padding: 28px 18px 45px;
    }

    header {
      text-align: center;
      padding: 18px 0 28px;
    }

    .brand {
      font-family: Georgia, serif;
      font-size: 30px;
      letter-spacing: 4px;
      color: #8e7770;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 12px;
      letter-spacing: 3px;
      color: #a99a91;
    }

    .hero {
      background: #fff;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(110, 91, 76, 0.07);
      margin-bottom: 30px;
    }

    .hero img {
      width: 100%;
      display: block;
      max-height: 620px;
      object-fit: cover;
      object-position: center top;
      background: #eee7e1;
    }

    .hero-info {
      text-align: center;
      padding: 20px 15px 23px;
    }

    .number {
      display: inline-block;
      color: #a77f80;
      border: 1px solid #dfc8c5;
      border-radius: 30px;
      padding: 3px 17px;
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .hero-title {
      font-size: 23px;
      letter-spacing: 3px;
      margin: 0;
      color: #65544e;
    }

    .hero-desc {
      font-size: 13px;
      color: #aa9b92;
      margin-top: 5px;
      letter-spacing: 1px;
    }

    .section-title {
      text-align: center;
      margin: 35px 0 20px;
    }

    .section-title h2 {
      font-size: 19px;
      font-weight: 500;
      letter-spacing: 4px;
      color: #806b64;
      margin: 0;
    }

    .section-title p {
      font-family: Georgia, serif;
      font-size: 11px;
      letter-spacing: 3px;
      color: #b6a59b;
      margin: 3px 0 0;
    }

    .shift-card {
      background: #fff;
      border-radius: 17px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 5px 20px rgba(110, 91, 76, 0.045);
      border: 1px solid #f0e9e3;
    }

    .shift-date {
      font-size: 20px;
      color: #a77f80;
      letter-spacing: 1px;
      margin-bottom: 7px;
    }

    .shift-time {
      font-size: 16px;
      color: #65544e;
      margin-bottom: 12px;
    }

    .store-name {
      display: inline-block;
      background: #f7efeb;
      color: #967a72;
      border-radius: 20px;
      padding: 4px 13px;
      font-size: 13px;
      margin-bottom: 13px;
    }

    .contact-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .contact-btn {
      flex: 1;
      min-width: 120px;
      text-align: center;
      text-decoration: none;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 13px;
      background: #f5f1ed;
      color: #806b64;
    }

    .contact-btn.phone {
      background: #eee8e2;
    }

    .empty {
      background: #fff;
      text-align: center;
      border-radius: 16px;
      padding: 35px 15px;
      color: #aa9b92;
      font-size: 14px;
    }

    footer {
      text-align: center;
      margin-top: 55px;
      padding-top: 25px;
      border-top: 1px solid #e9dfd7;
      color: #aa9b92;
      font-size: 12px;
    }

    footer a {
      color: #a77f80;
      text-decoration: none;
    }

    .copyright {
      margin-top: 12px;
      font-size: 11px;
      color: #c1b5ad;
    }

    @media (max-width: 480px) {
      .container {
        padding: 18px 14px 35px;
      }

      .brand {
        font-size: 27px;
      }

      .hero img {
        max-height: 520px;
      }

      .shift-card {
        padding: 17px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <div class="brand">No.66</div>
      <div class="subtitle">TAiNAN · SPA · RELAX</div>
    </header>

    <section class="hero">
      <img src="/no66.jpg" alt="No.66 美容師照片"
           onerror="this.style.display='none'">

      <div class="hero-info">
        <div class="number">No. 66</div>
        <h1 class="hero-title">台南按摩・SPA・養生館</h1>
        <div class="hero-desc">上班資訊・預約方式</div>
      </div>
    </section>

    <section>
      <div class="section-title">
        <h2>最新報班</h2>
        <p>SCHEDULE</p>
      </div>

      <div id="schedule">
        <div class="empty">報班資訊載入中...</div>
      </div>
    </section>

    <footer>
      <div>如需客製化網站可私訊聯絡我</div>
      <div>
        LINE：
        <a href="https://line.me/R/ti/p/~handsome_boy930"
           target="_blank" rel="noopener">
          handsome_boy930
        </a>
      </div>
      <div>價格便宜可洽</div>

      <div class="copyright">
        © 2026 No.66
      </div>
    </footer>

  </main>

  <script>
    const scheduleBox = document.getElementById("schedule");

    function formatDate(dateString) {
      const parts = dateString.split("-");
      return Number(parts[1]) + "/" + Number(parts[2]);
    }

    function createContactButtons(store) {
      let buttons = "";

      if (store.line) {
        buttons += `
          <a class="contact-btn"
             href="https://line.me/R/ti/p/~${encodeURIComponent(store.line)}"
             target="_blank"
             rel="noopener">
            LINE 預約
          </a>
        `;
      }

      if (store.phone) {
        buttons += `
          <a class="contact-btn phone"
             href="tel:${store.phone}">
            電話預約
          </a>
        `;
      }

      return buttons;
    }

    async function loadSchedule() {
      try {
        const response = await fetch("/api/site", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("資料載入失敗");
        }

        const data = await response.json();

        const shifts = Array.isArray(data.shifts)
          ? data.shifts
          : [];

        const stores = data.stores || {};

        if (shifts.length === 0) {
          scheduleBox.innerHTML = `
            <div class="empty">
              目前尚未公告報班，請稍後再查看。
            </div>
          `;
          return;
        }

        shifts.sort((a, b) => {
          const dateCompare = a.date.localeCompare(b.date);
          if (dateCompare !== 0) return dateCompare;
          return a.startTime.localeCompare(b.startTime);
        });

        scheduleBox.innerHTML = shifts.map(item => {
          const store = stores[item.storeId];

          if (!store) return "";

          return `
            <article class="shift-card">
              <div class="shift-date">
                ${formatDate(item.date)}
              </div>

              <div class="shift-time">
                ⏰ ${item.startTime} ～ ${item.endTime}
              </div>

              <div class="store-name">
                ${store.name}
              </div>

              <div class="contact-row">
                ${createContactButtons(store)}
              </div>
            </article>
          `;
        }).join("");

      } catch (error) {
        scheduleBox.innerHTML = `
          <div class="empty">
            報班資訊暫時無法載入，請稍後再試。
          </div>
        `;
      }
    }

    loadSchedule();
  </script>
</body>
</html>
